<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login Admin - Desa Seburing Hilir</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="login-container">

    <div class="login-box">

        <h2>Login Admin</h2>

        <p>
            Website Desa Seburing Hilir
        </p>


        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="loginMessage"></p>


        <a href="landing.html">
            ← Kembali ke Landing Page
        </a>

    </div>

</div>


<script src="config.js"></script>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();


    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    const message =
        document.getElementById("loginMessage");


    message.textContent = "Memeriksa login...";


    try {

        const response = await fetch(API_URL, {

            method: "POST",

            body: new URLSearchParams({

                action: "login",

                username: username,

                password: password

            })

        });


        const result =
            await response.json();


        if (result.status === "success") {

            sessionStorage.setItem(
                "adminLogin",
                "true"
            );

            window.location.href =
                "admin.html";

        } else {

            message.textContent =
                result.message;

        }


    } catch(error) {

        console.error(error);

        message.textContent =
            "Terjadi kesalahan koneksi.";

    }

});

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin - Desa Seburing Hilir</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="admin-container">

    <div class="admin-header">

        <div>

            <h1>Dashboard Admin</h1>

            <p>
                Kelola data Website Desa Seburing Hilir
            </p>

        </div>


        <button onclick="logout()">
            Logout
        </button>

    </div>


    <div class="admin-form">

        <h2>Tambah / Edit Data</h2>


        <input
            type="hidden"
            id="dataId"
        >


        <input
            type="text"
            id="judul"
            placeholder="Judul"
        >


        <select id="kategori">

            <option value="">
                Pilih Kategori
            </option>

            <option value="Alam">
                Alam
            </option>

            <option value="Desa">
                Desa
            </option>

            <option value="Pertanian">
                Pertanian
            </option>

        </select>


        <textarea
            id="deskripsi"
            placeholder="Deskripsi"
        ></textarea>


        <input
            type="text"
            id="gambar"
            placeholder="URL gambar"
        >


        <button onclick="saveData()">
            Simpan Data
        </button>


        <button onclick="clearForm()">
            Bersihkan
        </button>

    </div>


    <div class="database-admin">

        <h2>Data Website</h2>

        <div id="adminData">
            Memuat data...
        </div>

    </div>

</div>


<script src="config.js"></script>


<script>

if (sessionStorage.getItem("adminLogin") !== "true") {

    window.location.href = "login.html";

}


async function loadData() {

    const container =
        document.getElementById("adminData");


    try {

        const response = await fetch(API_URL, {

            method: "POST",

            body: new URLSearchParams({

                action: "getData"

            })

        });


        const result =
            await response.json();


        if (result.status !== "success") {

            container.innerHTML =
                "<p>Gagal mengambil data.</p>";

            return;

        }


        container.innerHTML = "";


        result.data.forEach(function(item) {

            const card =
                document.createElement("div");

            card.className =
                "admin-data-card";


            card.innerHTML = `

                <h3>
                    ${escapeHTML(item.judul)}
                </h3>

                <p>
                    <b>Kategori:</b>
                    ${escapeHTML(item.kategori)}
                </p>

                <p>
                    ${escapeHTML(item.deskripsi)}
                </p>

                ${
                    item.gambar
                    ?
                    `<img
                        src="${escapeHTML(item.gambar)}"
                        alt="${escapeHTML(item.judul)}"
                    >`
                    :
                    ""
                }

                <div>

                    <button
                        onclick='editData(${JSON.stringify(item)})'
                    >
                        Edit
                    </button>

                    <button
                        onclick="deleteData('${item.id}')"
                    >
                        Hapus
                    </button>

                </div>

            `;


            container.appendChild(card);

        });


    } catch(error) {

        console.error(error);

        container.innerHTML =
            "<p>Database tidak dapat diakses.</p>";

    }

}


async function saveData() {

    const id =
        document.getElementById("dataId").value;

    const judul =
        document.getElementById("judul").value;

    const kategori =
        document.getElementById("kategori").value;

    const deskripsi =
        document.getElementById("deskripsi").value;

    const gambar =
        document.getElementById("gambar").value;


    if (!judul || !kategori || !deskripsi) {

        alert("Judul, kategori, dan deskripsi wajib diisi.");

        return;

    }


    const action =
        id ? "update" : "add";


    try {

        const response = await fetch(API_URL, {

            method: "POST",

            body: new URLSearchParams({

                action: action,

                id: id,

                judul: judul,

                kategori: kategori,

                deskripsi: deskripsi,

                gambar: gambar

            })

        });


        const result =
            await response.json();


        alert(result.message);


        if (result.status === "success") {

            clearForm();

            loadData();

        }


    } catch(error) {

        console.error(error);

        alert("Terjadi kesalahan.");

    }

}


function editData(item) {

    document.getElementById("dataId").value =
        item.id;

    document.getElementById("judul").value =
        item.judul;

    document.getElementById("kategori").value =
        item.kategori;

    document.getElementById("deskripsi").value =
        item.deskripsi;

    document.getElementById("gambar").value =
        item.gambar || "";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


async function deleteData(id) {

    if (!confirm("Yakin ingin menghapus data ini?")) {

        return;

    }


    try {

        const response = await fetch(API_URL, {

            method: "POST",

            body: new URLSearchParams({

                action: "delete",

                id: id

            })

        });


        const result =
            await response.json();


        alert(result.message);


        if (result.status === "success") {

            loadData();

        }


    } catch(error) {

        console.error(error);

        alert("Gagal menghapus data.");

    }

}


function clearForm() {

    document.getElementById("dataId").value = "";

    document.getElementById("judul").value = "";

    document.getElementById("kategori").value = "";

    document.getElementById("deskripsi").value = "";

    document.getElementById("gambar").value = "";

}


function logout() {

    sessionStorage.removeItem("adminLogin");

    window.location.href =
        "login.html";

}


function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


loadData();

</script>

</body>

</html>
